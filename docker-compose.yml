services:
  db:
    image: postgis/postgis:16-3.4
    container_name: vigia-db
    environment:
      POSTGRES_USER: vigia
      POSTGRES_PASSWORD: vigia
      POSTGRES_DB: vigia
    ports:
      - "5432:5432"
    volumes:
      - vigia_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigia -d vigia"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vigia_pgdata:
