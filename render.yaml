# Blueprint de Render para desplegar Vigia (API + web + PostGIS) en un clic.
# Docs: https://render.com/docs/blueprint-spec
#
# Requiere fijar en el panel de Render (no se versionan por seguridad):
#   - vigia-api → ADMIN_PASSWORD  (contraseña del panel de administración)
#   - vigia-api → FIRMS_MAP_KEY   (opcional; focos de incendio en vivo de la NASA)
#   - vigia-web → NEXT_PUBLIC_API_URL  (la URL pública de vigia-api, p. ej.
#                                       https://vigia-api.onrender.com)
# AUTH_SECRET se genera solo. DATABASE_URL se enlaza a la base gestionada.

databases:
  - name: vigia-db
    plan: free
    postgresMajorVersion: "16"
    # PostGIS se habilita solo desde las migraciones
    # (CREATE EXTENSION IF NOT EXISTS postgis en 001_init.sql).

services:
  # API (Express + PostGIS). Render inyecta PORT y la app lo respeta.
  - type: web
    name: vigia-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    # Aplica las migraciones (idempotentes) antes de cada despliegue.
    preDeployCommand: node scripts/migrate.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vigia-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: AUTH_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false # se define en el panel de Render
      - key: FIRMS_MAP_KEY
        sync: false # opcional; sin ella el dashboard usa el demo de incendios

  # Frontend (Next.js standalone). NEXT_PUBLIC_API_URL se hornea en el build.
  - type: web
    name: vigia-web
    runtime: docker
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false # la URL pública de vigia-api (Render la pasa como build-arg)
